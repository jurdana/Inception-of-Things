# Redis for GitLab (chart 10.x no longer bundles it).
# Names must match global.redis in gitlab-values.yaml:
#   host gitlab-redis.gitlab.svc, secret gitlab-redis / key password
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis
  namespace: gitlab
type: Opaque
stringData:
  # Demo password, only reachable inside the cluster
  password: "1234"
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-redis
  namespace: gitlab
spec:
  selector:
    app: gitlab-redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-redis
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-redis
  template:
    metadata:
      labels:
        app: gitlab-redis
    spec:
      containers:
      - name: redis
        image: redis:7.2
        # $(REDIS_PASSWORD) is substituted by Kubernetes from the env below
        args: ["--requirepass", "$(REDIS_PASSWORD)"]
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitlab-redis
              key: password
        readinessProbe:
          exec:
            command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
          initialDelaySeconds: 3
          periodSeconds: 5
